<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW 31 - jQuery plugins</title>
    <link rel="stylesheet" href="assets/style/style.min.css">
</head>

<body>
    <div class="page-wrapper">
        <div class="container">
            <header>
                <nav class="main-menu">
                    <ul class="nav-list">
                        <li>
                            <a href="pages/main.html">
                                <svg class="icon">
                                    <use xlink:href="assets/img/sprite.svg#info-icon"></use>
                                </svg>
                                <span>Information</span>
                            </a>
                        </li>
                        <li>
                            <a href="pages/ratings.html">
                                <svg class="icon">
                                    <use xlink:href="assets/img/sprite.svg#spades-icon"></use>
                                </svg>
                                <span>Ratings Info</span>
                            </a>
                        </li>
                        <li>
                            <a href="pages/buy.html">
                                <svg class="icon">
                                    <use xlink:href="assets/img/sprite.svg#bag-icon"></use>
                                </svg>
                                <span>Where to Buy</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </header>
            <main id="main-content">
                <div class="content">
                    <div class="img-info">
                        <div class="img-wrap">
                            <img src="assets/img/farcry-image.jpg" alt="FarCry title image">
                        </div>
                        <div class="rating">
                            <svg class="icon yellow">
                                <use xlink:href="assets/img/sprite.svg#star-icon"></use>
                            </svg>
                            <svg class="icon yellow">
                                <use xlink:href="assets/img/sprite.svg#star-icon"></use>
                            </svg>
                            <svg class="icon yellow">
                                <use xlink:href="assets/img/sprite.svg#star-icon"></use>
                            </svg>
                            <svg class="icon yellow">
                                <use xlink:href="assets/img/sprite.svg#star-icon"></use>
                            </svg>
                            <svg class="icon">
                                <use xlink:href="assets/img/sprite.svg#star-icon"></use>
                            </svg>
                        </div>
                    </div>
                    <div class="text-info">
                        <div class="main-info">
                            <hgroup>
                                <h2>FarCry 6</h2>
                                <p>First Released Oct 6, 2021</p>
                            </hgroup>
                            <div class="donutty" id="donutty" data-donutty data-radius="400" data-value="8.7"
                                data-min="0" data-max="10" data-color="url(#grad)" data-dir="rtl" data-anchor="top"
                                data-padding="4" data-thickness="40" data-round="false" data-bg="#B7BACD">
                            </div>
                        </div>
                        <p>Far Cry 6 is a 2021 action-adventure first-person shooter game developed by Ubisoft Toronto.
                            It
                            is
                            the sixth main installment in the Far Cry series and the successor Far Cry 5.
                        </p>
                        <div class="buy-info">
                            <div class="price">
                                <span class="discount">20% OFF!</span>
                                <div class="current-price">$59.96</div>
                            </div>
                            <a href="buy.html" class="btn">BUY IT NOW</a>
                        </div>
                    </div>
                </div>
            </main>
            <footer></footer>
        </div>
    </div>
    <script src="assets/js/jquery/jquery-3.7.1.slim.min.js"></script>
    <script src="assets/js/jquery/Donut-Pie-Ring-Charts-SVG-Donutty/dist/donutty-jquery.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
